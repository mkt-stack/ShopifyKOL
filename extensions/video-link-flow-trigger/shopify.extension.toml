# Learn more about Flow trigger extensions at
# https://shopify.dev/docs/apps/build/flow/triggers/reference
#
# Custom field `key` values must be alphabetic characters and spaces only
# (no underscores/hyphens/digits) — Shopify title-cases these for the JSON
# payload key you send from the app (see buildFlowTriggerPayload in
# app/lib/tiktok-submission.server.js, which must match verbatim).

[[extensions]]
name = "Video link submitted"
handle = "video-link-submitted"
type = "flow_trigger"
description = "Fires when a customer's TikTok/Shopee video link is successfully saved to an order."

[settings]
  [[settings.fields]]
  type = "customer_reference"

  [[settings.fields]]
  type = "order_reference"

  [[settings.fields]]
  type = "product_reference"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Order name"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Customer name"

  [[settings.fields]]
  type = "email"
  key = "Customer email"

  [[settings.fields]]
  type = "url"
  key = "Video URL"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Platform"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Creator handle"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Post date"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Submission ID"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Submitted at"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Product titles"

  [[settings.fields]]
  type = "number_decimal"
  key = "Line item count"
