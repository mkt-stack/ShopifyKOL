  type = "order_reference"

  [[settings.fields]]
  type = "customer_reference"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Tag added"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Order name"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Customer name"

  [[settings.fields]]
  type = "email"
  key = "Customer email"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "All tags"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Financial status"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Fulfillment status"

  [[settings.fields]]
  type = "number_decimal"
  key = "Total price"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Currency"
