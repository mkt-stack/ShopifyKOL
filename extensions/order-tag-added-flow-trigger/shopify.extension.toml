# Learn more about Flow trigger extensions at
# https://shopify.dev/docs/apps/build/flow/triggers/reference
#
# Custom field `key` values must be alphabetic characters and spaces only
# (no underscores/hyphens/digits) — Shopify title-cases these for the JSON
# payload key you send from the app (see buildOrderTagAddedPayload in
# app/lib/order-tag-flow.server.js, which must match verbatim).

[[extensions]]
name = "Order tag added"
handle = "order-tag-added"
type = "flow_trigger"
description = "Fires when a tag is added to an order."

[settings]
